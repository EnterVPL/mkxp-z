name: Linux autobuild
on:
  push:
    branches: ['dev', 'autobuild']
    paths-ignore: ['*.md', '*.json', '*.png']
  pull_request:
    branches: ['dev', 'autobuild']
    paths-ignore: ['*.md', '*.json', '*.png']

env:
  STEAM_APPID: "${{ secrets.STEAM_APPID }}"
  STEAM_PATH: "${{ github.workspace }}/steam_sdk"
  APPIMG_TOOLKIT: "${{ github.workspace }}/linux/appimg_toolkit"

jobs:
  build-linux-native:
    name: Ubuntu 22.04 x86_64
    runs-on: ubuntu-22.04
    steps:
      - uses: benjlevesque/short-sha@v3.0
        id: short-sha
        with:
          length: 7

      - name: Checkout repository
        uses: actions/checkout@v6

      - uses: actions/cache@v5
        with:
          path: |
            linux/build-x86_64
            linux/downloads
          key: lin-x86_64-${{ hashFiles('linux/Makefile') }}

      - name: Checkout private steam sdk repo
        uses: actions/checkout@v6
        with:
          repository: ${{ secrets.STEAM_SDK_REPO }}
          token: ${{ secrets.STEAM_SDK_TOKEN }}
          path: steam_sdk

      - name: Install apt dependencies
        run: |
          sudo apt update
          sudo apt install git wget build-essential cmake ninja-build python3-pip autoconf automake libtool pkg-config ruby bison xxd zlib1g-dev libbz2-dev xorg-dev libgl1-mesa-dev libasound2-dev libpulse-dev -y
          pip3 install meson

      - name: Build everything else
        run: |
          cd linux
          make

      - name: Build executable
        env:
          STEAM_APPID: "${{ secrets.STEAM_APPID }}"
        run: |
          source linux/vars.sh
          meson setup build  \
            --bindir=. --prefix=$GITHUB_WORKSPACE/build/local
            -Duse_miniffi=true \
            -Dsteamworks_path="$STEAM_PATH" \
            -Dsteam_appid="$STEAM_APPID" \
            -Dappimagekit_path="$APPIMG_TOOLKIT"
          cd build
          ninja
          ninja install

      - name: Prepare archive
        run: |
          cd build/local
          cp -r ../../linux/build-x86_64/lib/ruby/3.1.0 .
          mv ./3.1.0 ./stdlib
          cp ../../mkxp.json .
          cp -r ../../scripts .
          cp ../../assets/LICENSE.mkxp-z-with-https.txt .

      - uses: actions/upload-artifact@v7
        with:
          name: mkxp-z.linux.ubuntu.22.04.x86_64.${{github.event_name == 'pull_request' && format('PR{0}', github.event.number) || github.ref_name}}-${{steps.short-sha.outputs.sha}}
          path: build/local

