name: Automatic Build BASE SPARE

on:
  push:
    branches: ['dev', 'autobuild']
    paths-ignore: ['*.md', '*.json', '*.png']
  pull_request:
    branches: ['dev', 'autobuild']
    paths-ignore: ['*.md', '*.json', '*.png']

env:
  BUILD_KEY: "win_base_spare"
  EXE_ICON_FILE: icons/BAASE_ICON.png
  TEMP_OUTPUT_EXE_ICON_FILE: /tmp/icon.ico

jobs:
  build-windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: benjlevesque/short-sha@v3.0
        id: short-sha
        with:
          length: 7

      - uses: msys2/setup-msys2@v2
        with:
          msystem: mingw64
          update: true
          install: >-
            base-devel
            git
            ruby
            vim
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-meson
            mingw-w64-x86_64-autotools
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-imagemagick
            mingw-w64-x86_64-rcedit

    
      - name: Checkout repository
        uses: actions/checkout@v6

      - uses: actions/cache@v5
        with:
          path: |
            windows/build-mingw64
            windows/downloads
          key: win-spare-release-${{ hashFiles('windows/Makefile') }}-v2


      - name: Prepare icon files
        shell: msys2 {0}
        run: |
          echo "Start copying icon ${{env.EXE_ICON_FILE}}..."
          cp -f "${{env.EXE_ICON_FILE}}" "./assets/icon.png" || true
          mkdir -p /tmp
          echo "Convert to *. ico file"
          magick "${{env.EXE_ICON_FILE}}" "${{env.TEMP_OUTPUT_EXE_ICON_FILE}}"
          cp -f "${{env.TEMP_OUTPUT_EXE_ICON_FILE}}" "./windows/icon.ico"
          echo "DONE"

      - name: Checkout private steam sdk repo
        uses: actions/checkout@v6
        with:
          repository: ${{ secrets.STEAM_SDK_REPO }}
          token: ${{ secrets.STEAM_SDK_TOKEN }}
          path: steam_sdk
      


      - name: Build all dependencies
        shell: msys2 {0}
        run: |
          cd windows
          make

      - name: Build exe
        env:
          STEAM_APPID: 1964650
        shell: msys2 {0}
        run: |
          source windows/vars.sh
          STEAM_PATH=$(cygpath -u "${{ github.workspace }}/steam_sdk")
          rm -rf build

          meson setup build \
            -Duse_miniffi=true \
            -Dsteamworks_path="$STEAM_PATH" \
            -Dsteam_appid="$STEAM_APPID"
     
           cd build
           ninja
           strip ./mkxp-z.exe

      - name: Prepare archive
        shell: msys2 {0}
        run: |
          echo "Set icon for non-steam exe (steam exe file has icon from build)"
          rcedit "mkxp-z.exe" --set-icon "${{env.TEMP_OUTPUT_EXE_ICON_FILE}}"
          echo "Prepare steam path"
          STEAM_PATH=$(cygpath -u "${{ github.workspace }}/steam_sdk")
          mkdir build/artifact
          echo "START COPYING FILES"
          cd build/artifact
          cp /mingw64/bin/zlib1.dll .
          cp ../../windows/build-mingw64/bin/x64-msvcrt-ruby310.dll .
          cp -r ../../windows/build-mingw64/lib/ruby/3.1.0 .
          mv ./3.1.0 ./stdlib
          cp ../mkxp-z.exe .
          cp ../steam_mkxp-z.exe .
          cp $STEAM_PATH/steam_api64.dll .
          cp ../../mkxp.json .
          cp -r ../../scripts .
          cp ../../assets/LICENSE.mkxp-z-with-https.txt .
          echo "Files copying success!"


      - name: Check for DLLs missing from the artifact
        shell: msys2 {0}
        run: |
          cd build/artifact
          error_flag=

          for file in *.exe *.dll
          do
            ldd_output="$(ldd "$file")"
            echo "$file"
            echo "$ldd_output"

            while IFS= read -r line
            do
              dll_name="$(echo "$line" | sed -e 's/=>/|/g' | cut -d '|' -f 1 | sed -e 's/^[ \t]*//g' -e 's/[ \t]*$//g')"
              dll_location="$(echo "$line" | sed -e 's/=>/|/g' | cut -d '|' -f 2 | sed -e 's/^[ \t]*//g' -e 's/[ \t]*$//g')"
              if [[ "$dll_location" = 'not found'* ]] || [[ "$dll_location" = '/mingw64/bin/'* ]] || [[ "$dll_location" = '/mingw64/lib/'* ]] || [[ "$dll_location" = '/mingw64/usr/bin/'* ]] || [[ "$dll_location" = '/mingw64/usr/lib/'* ]]
              then
                error_flag=1
                echo "::error::$dll_name is missing from the artifact"
              fi
            done <<< "$ldd_output"
          done

          if [ -n "$error_flag" ]
          then
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: mkxp-z.autobiuld.windows.${{ env.BUILD_KEY }}
          path: build/artifact